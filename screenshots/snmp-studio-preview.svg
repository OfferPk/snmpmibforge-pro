<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgDarkSNMP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="accentGradSNMP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDarkSNMP)"/>

  <!-- Top App Header -->
  <rect x="30" y="24" width="1140" height="60" rx="10" fill="#0b1124" stroke="#1a264a" stroke-width="1.5"/>
  <rect x="46" y="38" width="95" height="32" rx="8" fill="url(#accentGradSNMP)"/>
  <text x="93" y="59" fill="#04101e" font-family="-apple-system, sans-serif" font-weight="900" font-size="12" text-anchor="middle">SNMPv3-USM</text>
  
  <text x="155" y="55" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="800" font-size="18">SNMPMibForge Pro</text>
  <text x="375" y="55" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">v1.0.0</text>
  <text x="425" y="55" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">| Enterprise SNMPv3 USM/VACM Security Studio</text>

  <rect x="850" y="40" width="150" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4"/>
  <text x="925" y="58" fill="#22d3ee" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">RFC 3411-3418</text>

  <rect x="1015" y="40" width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="1087" y="58" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" text-anchor="middle">ZERO-TRUST VERIFIED</text>

  <!-- Left Column: USM Settings & Key Localization -->
  <rect x="30" y="100" width="555" height="545" rx="12" fill="#0b1124" stroke="#1a264a" stroke-width="1.5"/>
  <text x="50" y="130" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">USM Cryptographic Controls &amp; Authoritative EngineID</text>

  <!-- Username & SecLevel -->
  <rect x="50" y="145" width="245" height="50" rx="6" fill="#060b18" stroke="#1a264a"/>
  <text x="60" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">SNMPV3 SECURITY USERNAME</text>
  <text x="60" y="185" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">secops_monitor</text>

  <rect x="315" y="145" width="250" height="50" rx="6" fill="#060b18" stroke="#1a264a"/>
  <text x="325" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">USM SECURITY LEVEL</text>
  <text x="325" y="185" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">authPriv (Auth + Privacy)</text>

  <!-- Auth & Priv Algorithms -->
  <rect x="50" y="205" width="245" height="50" rx="6" fill="#060b18" stroke="#1a264a"/>
  <text x="60" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">AUTH PROTOCOL (RFC 7860)</text>
  <text x="60" y="245" fill="#a855f7" font-family="monospace" font-size="11" font-weight="700">HMAC-SHA-256</text>

  <rect x="315" y="205" width="250" height="50" rx="6" fill="#060b18" stroke="#1a264a"/>
  <text x="325" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">PRIVACY ENCRYPTION CIPHER</text>
  <text x="325" y="245" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">AES-256-CFB (FIPS 140-3)</text>

  <!-- Toggles Grid -->
  <text x="50" y="278" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Zero-Trust Telemetry Enforcements</text>

  <rect x="50" y="290" width="245" height="50" rx="8" fill="#080c1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="65" y="310" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🔒 Enforce SNMPv3 Only</text>
  <text x="65" y="328" fill="#94a3b8" font-family="monospace" font-size="10">Blocks v1/v2c cleartext</text>

  <rect x="315" y="290" width="250" height="50" rx="8" fill="#080c1a" stroke="#10b981" stroke-width="1.2"/>
  <text x="330" y="310" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">🛡️ Read-Only Gating (RO)</text>
  <text x="330" y="328" fill="#94a3b8" font-family="monospace" font-size="10">Blocks remote Set attacks</text>

  <!-- Live Key Localization Box -->
  <text x="50" y="365" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">🔑 RFC 3414 Localized Cryptographic Key Sandbox</text>
  <rect x="50" y="375" width="515" height="250" rx="8" fill="#070c1e" stroke="#1a264a"/>

  <text x="65" y="405" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">LOCALIZED SHA-256 AUTHENTICATION KEY:</text>
  <rect x="65" y="415" width="485" height="34" rx="4" fill="#03050c" stroke="#1a264a"/>
  <text x="75" y="437" fill="#38bdf8" font-family="monospace" font-size="10">064d6ad84240299928b26eca1facd221f534611872677c6b1b8825ccab1efde3</text>

  <text x="65" y="475" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">AUTHORITATIVE ENGINEID BREAKDOWN (RFC 3411):</text>
  <rect x="65" y="485" width="485" height="34" rx="4" fill="#03050c" stroke="#1a264a"/>
  <text x="75" y="507" fill="#34d399" font-family="monospace" font-size="11">Enterprise #9 (Cisco) | Format: MAC Address | Length: 11 octets</text>

  <text x="65" y="545" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">&bull; Key localization expands user passphrase over 1MB buffer with EngineID</text>
  <text x="65" y="570" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">&bull; Prevents duplicate passwords across different devices sharing same hash</text>
  <text x="65" y="605" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">✅ NIST SP 800-131A &amp; RFC 7860 Compliant</text>

  <!-- Right Column: 10-Point Scorecard & Synthesizer -->
  <rect x="615" y="100" width="555" height="545" rx="12" fill="#0b1124" stroke="#1a264a" stroke-width="1.5"/>

  <!-- Score banner -->
  <rect x="635" y="120" width="515" height="70" rx="10" fill="#080e22" stroke="#1a264a"/>
  <rect x="650" y="130" width="50" height="50" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
  <text x="675" y="163" fill="#34d399" font-family="monospace" font-weight="800" font-size="22" text-anchor="middle">A+</text>
  <text x="715" y="148" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Zero-Trust Score: 100 / 100</text>
  <text x="715" y="168" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12">RFC 3414 Compliant • authPriv • SHA-256 / AES-256</text>

  <!-- Checklist items -->
  <rect x="635" y="200" width="515" height="32" rx="6" fill="#080c1a" stroke="#1a264a"/>
  <text x="650" y="221" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ SNMP Protocol Version (15/15 pts) - SNMPv3 USM mandated</text>

  <rect x="635" y="238" width="515" height="32" rx="6" fill="#080c1a" stroke="#1a264a"/>
  <text x="650" y="259" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ USM Security Level (15/15 pts) - authPriv authentication &amp; encryption</text>

  <rect x="635" y="276" width="515" height="32" rx="6" fill="#080c1a" stroke="#1a264a"/>
  <text x="650" y="297" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ Authentication Protocol (15/15 pts) - HMAC-SHA-256 (no MD5)</text>

  <rect x="635" y="314" width="515" height="32" rx="6" fill="#080c1a" stroke="#1a264a"/>
  <text x="650" y="335" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ Privacy Cipher (10/10 pts) - AES-256-CFB (no DES)</text>

  <rect x="635" y="352" width="515" height="32" rx="6" fill="#080c1a" stroke="#1a264a"/>
  <text x="650" y="373" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">✅ VACM Least Privilege (10/10 pts) - Explicit system/interfaces views</text>

  <!-- Synthesizer Box -->
  <text x="635" y="405" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="13">Multi-Vendor Synthesizer (Active: Net-SNMP snmpd.conf)</text>
  <rect x="635" y="415" width="515" height="215" rx="8" fill="#040714" stroke="#1a264a"/>
  <text x="650" y="438" fill="#38bdf8" font-family="monospace" font-size="10">engineID 800000090300005e005301</text>
  <text x="650" y="458" fill="#38bdf8" font-family="monospace" font-size="10">view VIEW_SECURE_TELEMETRY included .1.3.6.1.2.1.1 fe</text>
  <text x="650" y="478" fill="#38bdf8" font-family="monospace" font-size="10">view VIEW_SECURE_TELEMETRY included .1.3.6.1.2.1.2 fe</text>
  <text x="650" y="505" fill="#c084fc" font-family="monospace" font-size="10">createUser secops_monitor SHA256 "AuthPass#..." AES "PrivPass#..."</text>
  <text x="650" y="525" fill="#c084fc" font-family="monospace" font-size="10">rouser secops_monitor priv -V VIEW_SECURE_TELEMETRY</text>
  <text x="650" y="565" fill="#34d399" font-family="monospace" font-size="10"># Cisco: snmp-server user secops_monitor v3 auth sha-256 priv aes 256</text>
  <text x="650" y="585" fill="#34d399" font-family="monospace" font-size="10"># Prometheus: walk: [.1.3.6.1.2.1.1, .1.3.6.1.2.1.2] version: 3</text>
  <text x="650" y="615" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">&bull; 1-click export for Net-SNMP, Cisco IOS-XE, Juniper Junos, Prometheus</text>
</svg>
