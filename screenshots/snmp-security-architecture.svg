<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchSNMP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchSNMP)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Enterprise SNMP Architecture: Vulnerable vs Zero-Trust Enforced
  </text>

  <!-- Left: Flawed Deployment -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Legacy Insecure SNMPv1 / v2c
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#060b18" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Cleartext Community 'public' &bull; Port 161 UDP</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Read-Write (RW) Enabled &bull; Full Internet Root (.1.3.6.1)</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC TELEMETRY ATTACK VECTORS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Cleartext community string intercepted via passive network tap</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Remote SNMP Set attacks allow unauthorized device reconfiguration</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Full MIB tree exposure dumps routing tables, ARP caches, and IPs</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Zero packet authentication permits alarm spoofing and DoS reboots</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">REMOTE DEVICE HIJACK &bull; NETWORK RECONNAISSANCE &bull; OUTAGE</text>

  <!-- Right: Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#061614" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: SNMPMibForge Pro Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#060b18" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">SNMPv3 authPriv &bull; HMAC-SHA-256 Auth</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">AES-256-CFB Encryption &bull; RFC 3414 Key Localization</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b16" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; authPriv encryption ensures telemetry confidentiality across switches</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Key localization with EngineID prevents cross-device password reuse</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; VACM least-privilege views shield proprietary OIDs and network topology</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Strict Read-Only gating eliminates all remote configuration tampering</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">RFC 3411-3418 &bull; NIST SP 800-131A &bull; ZERO EXPOSURE</text>
</svg>
